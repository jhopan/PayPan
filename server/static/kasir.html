<div id="formView">
<div class="amt" style="font-size:26px;font-weight:700">Buat Tagihan</div>
<label style="display:block;font-size:13px;color:#344054;font-weight:600;margin:14px 0 6px">Nominal tagihan (Rp)</label>
<input type="number" id="price" inputmode="numeric" placeholder="0" min="1" max="9000000" style="width:100%;padding:12px;font-size:22px;border:1px solid #d0d5dd;border-radius:10px;text-align:center;box-sizing:border-box">
<div class="hint">Kode unik 1-999 ditambahkan otomatis agar bisa dicocokkan</div>
<button id="btn" onclick="buat()">Buat QRIS</button>
</div>

<div id="payView" style="display:none">
<div class="amt" id="amt"></div>
<div><span class="badge pending" id="badge">MENUNGGU PEMBAYARAN</span></div>
<div class="qrbox"><img id="qr" alt="QRIS"></div>
<div class="hint">Scan dengan e-wallet / m-banking.<br>Nominal sudah terisi otomatis.</div>
<div class="order-id" id="oid"></div>
<div class="done" id="done" style="display:none">
<div class="ok">✅</div>
<b>PEMBAYARAN DITERIMA</b>
</div>
<button id="again" style="display:none;background:#101828" onclick="reset()">Buat Tagihan Baru</button>
</div>

<script>
const API = '';            // same-origin
const AUTH = 'session';    // admin session cookie
function rp(n){ return 'Rp ' + Number(n).toLocaleString('id-ID'); }
async function buat(){
  const price = parseInt(document.getElementById('price').value, 10);
  if(!price || price < 1){ alert('Isi nominal dulu'); return; }
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = 'Memproses...';
  try{
    const res = await fetch(API + '/admin/kasir/order', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      credentials:'same-origin',
      body: JSON.stringify({price: price, label:'kasir'})
    });
    const j = await res.json();
    if(!res.ok || j.error){ throw new Error(j.error || res.status); }
    showPay(j);
  }catch(e){
    alert('Gagal: ' + e.message);
    btn.disabled = false; btn.textContent = 'Buat QRIS';
  }
}

function showPay(o){
  document.getElementById('formView').style.display = 'none';
  document.getElementById('payView').style.display = 'block';
  document.getElementById('amt').textContent = rp(o.total);
  document.getElementById('qr').src = API + '/admin/qr/' + o.id + '.png';
  document.getElementById('oid').textContent = 'Order ' + o.id;
  document.getElementById('qr').style.display = 'block';
  poll(o.id);
}

async function poll(id){
  try{
    const j = await (await fetch(API + '/api/order/' + id)).json();
    const b = document.getElementById('badge');
    b.className = 'badge ' + j.status;
    if(j.status === 'paid'){
      b.textContent = 'LUNAS';
      document.getElementById('done').style.display = 'block';
      document.getElementById('qr').style.display = 'none';
      document.getElementById('qr').parentElement.style.display = 'none';
      document.getElementById('again').style.display = 'block';
      return;
    }
    if(j.status === 'expired'){
      b.textContent = 'KADALUARSA';
      document.getElementById('qr').parentElement.style.display = 'none';
      document.getElementById('again').style.display = 'block';
      return;
    }
    b.textContent = 'MENUNGGU PEMBAYARAN';
    setTimeout(() => poll(id), 3000);
  }catch(e){
    setTimeout(() => poll(id), 5000);
  }
}

function reset(){
  document.getElementById('payView').style.display = 'none';
  document.getElementById('formView').style.display = 'block';
  document.getElementById('price').value = '';
  document.getElementById('done').style.display = 'none';
  document.getElementById('again').style.display = 'none';
  document.getElementById('qr').parentElement.style.display = 'inline-block';
  document.getElementById('btn').disabled = false;
  document.getElementById('btn').textContent = 'Buat QRIS';
}
document.getElementById('price').addEventListener('keydown', e => { if(e.key==='Enter') buat(); });
</script>
