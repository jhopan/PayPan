name: Build & Release

# Dua jenis release (pola PanRouter):
#   1. Release berversi (vX.Y.Z) — riwayat permanen
#   2. Release "latest"          — selalu build terbaru, URL stabil
#
# URL stabil:
#   https://github.com/jhopan/PayPan/releases/latest/download/paypan-linux-amd64.tar.gz
#   https://github.com/jhopan/PayPan/releases/latest/download/paypan-linux-arm64.tar.gz
#   https://github.com/jhopan/PayPan/releases/latest/download/install.sh
#
# Versi baru:  git tag v1.2.0 && git push origin v1.2.0

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  VERSION: 1.1.1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Vet
        run: go vet ./...

      - name: Unit test
        run: go test ./...

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V=$(git tag --list 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
            if [ -z "$V" ]; then V="${{ env.VERSION }}"; fi
          fi
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"
          echo "resolved: $V"

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/paypan-linux-amd64 .
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/paypan-linux-arm64 .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/paypan-windows-amd64.exe .

      - name: Smoke test
        run: |
          file dist/paypan-linux-amd64 | grep -q "ELF 64-bit" && echo "amd64 OK"
          file dist/paypan-linux-arm64 | grep -q "ELF 64-bit" && echo "arm64 OK"
          file dist/paypan-windows-amd64.exe | grep -q "MS Windows" && echo "windows OK"

      - name: Package
        run: |
          cd dist
          tar czf paypan-linux-amd64.tar.gz paypan-linux-amd64
          tar czf paypan-linux-arm64.tar.gz paypan-linux-arm64
          sha256sum paypan-linux-amd64 paypan-linux-arm64 paypan-windows-amd64.exe > checksums.txt
          cp ../install.sh install.sh
          chmod +x install.sh
          ls -la

      - name: Notes
        run: |
          V="${{ steps.ver.outputs.VERSION }}"
          PREV=$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null | grep -E '^v[0-9]' || true)
          {
            echo "## PayPan v${V}"
            echo ""
            echo "Server payment gateway QRIS — Go, single binary, SQLite murni."
            echo ""
            echo "### Perubahan"
            echo ""
            if [ -n "$PREV" ]; then git log --pretty=format:"- %s" "${PREV}..HEAD"; else git log --pretty=format:"- %s" HEAD~20..HEAD; fi
            echo ""
            echo ""
            echo "### Aset"
            echo ""
            echo "| File | Platform |"
            echo "|---|---|"
            echo "| \`paypan-linux-amd64.tar.gz\` | Linux x86_64 |"
            echo "| \`paypan-linux-arm64.tar.gz\` | Linux ARM64 (Armbian/STB) |"
            echo "| \`paypan-windows-amd64.exe\` | Windows x64 |"
            echo "| \`install.sh\` | Instalasi otomatis |"
            echo "| \`checksums.txt\` | SHA256 |"
            echo ""
            echo "### Install"
            echo ""
            echo '```bash'
            echo "curl -fsSL https://github.com/jhopan/PayPan/releases/latest/download/install.sh | bash"
            echo '```'
            echo ""
            echo "Login default \`admin\`/\`admin123\` — wajib diganti."
            echo "Docs: [README](https://github.com/jhopan/PayPan#readme) · [API](https://github.com/jhopan/PayPan/blob/master/API.md) · [ENV](https://github.com/jhopan/PayPan/blob/master/ENV.md)"
          } > /tmp/notes.md
          head -20 /tmp/notes.md

      - name: Versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.VERSION }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            gh release delete "v${V}" --yes 2>/dev/null || true
            gh release create "v${V}" --title "PayPan v${V}" --notes-file /tmp/notes.md \
              dist/paypan-linux-amd64.tar.gz dist/paypan-linux-arm64.tar.gz \
              dist/paypan-windows-amd64.exe dist/install.sh dist/checksums.txt
          elif ! gh release view "v${V}" >/dev/null 2>&1; then
            gh release create "v${V}" --title "PayPan v${V}" --notes-file /tmp/notes.md \
              dist/paypan-linux-amd64.tar.gz dist/paypan-linux-arm64.tar.gz \
              dist/paypan-windows-amd64.exe dist/install.sh dist/checksums.txt
          else
            echo "release v${V} sudah ada — lewati"
          fi

      - name: Latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.VERSION }}"
          gh release delete latest --yes 2>/dev/null || true
          gh release create latest --title "Latest build" --latest \
            --notes "Build terbaru PayPan — saat ini **v${V}**.

          URL stabil:
          - \`releases/latest/download/paypan-linux-amd64.tar.gz\`
          - \`releases/latest/download/paypan-linux-arm64.tar.gz\`
          - \`releases/latest/download/install.sh\`

          Install: \`curl -fsSL https://github.com/jhopan/PayPan/releases/latest/download/install.sh | bash\`" \
            dist/paypan-linux-amd64.tar.gz dist/paypan-linux-arm64.tar.gz \
            dist/paypan-windows-amd64.exe dist/install.sh dist/checksums.txt
